<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#fdf9f3"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0ab"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="370" y="30" width="160" height="46" rx="16" fill="#2b3040"/>
  <text x="450" y="59" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Input</text>
  <line x1="450" y1="76" x2="450" y2="112" stroke="#9aa0ab" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Workflow container -->
  <rect x="70" y="128" width="760" height="210" rx="20" fill="#ffffff" stroke="#e4e0d8" stroke-width="2"/>
  <rect x="360" y="112" width="180" height="46" rx="16" fill="#2b3040"/>
  <text x="450" y="141" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Workflow</text>

  <!-- Agents -->
  <rect x="120" y="196" width="180" height="96" rx="18" fill="#3b53b8"/>
  <text x="210" y="252" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Agent A</text>
  <rect x="360" y="196" width="180" height="96" rx="18" fill="#3b53b8"/>
  <text x="450" y="252" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Agent B</text>
  <rect x="600" y="196" width="180" height="96" rx="18" fill="#3b53b8"/>
  <text x="690" y="252" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Agent C</text>

  <!-- out -->
  <line x1="450" y1="338" x2="450" y2="380" stroke="#9aa0ab" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="370" y="396" width="160" height="46" rx="16" fill="#2b3040"/>
  <text x="450" y="425" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Output</text>
</svg>
